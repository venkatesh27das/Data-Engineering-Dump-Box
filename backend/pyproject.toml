[project]
name = "workbook-agent"
version = "0.1.0"
description = "Local-first Excel workbook knowledge extraction service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.8",
  "uvicorn[standard]>=0.34.0",
  "pydantic>=2.10.6",
  "pydantic-settings>=2.7.1",
  "python-multipart>=0.0.20",
  "httpx>=0.28.1",
  "openpyxl>=3.1.5",
  "pyxlsb>=1.0.10",
  "pyarrow>=19.0.0",
  "pillow>=11.1.0",
  "deepagents>=0.5.2",
  "langchain-openai>=0.3.0",
  "oletools>=0.60.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.4", "pytest-asyncio>=0.25.3", "ruff>=0.9.6"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::pyparsing.PyparsingDeprecationWarning:oletools.olevba"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.uv]
package = false
