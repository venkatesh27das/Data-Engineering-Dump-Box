[project]
name = "knowledge-graph-builder-backend"
version = "0.1.0"
description = "FastAPI backend for the Knowledge Graph Builder POC"
requires-python = ">=3.12"
dependencies = [
  "deepagents>=0.4,<1.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "langchain-openai>=1.0,<2.0",
  "langgraph>=1.0,<2.0",
  "langgraph-checkpoint-sqlite>=3.0,<4.0",
  "neo4j>=6.0,<7.0",
  "pillow>=11.1,<13.0",
  "pydantic-settings>=2.7,<3.0",
  "pypdf>=5.1,<7.0",
  "pytesseract>=0.3.13,<1.0",
  "python-docx>=1.1,<2.0",
  "python-multipart>=0.0.20,<1.0",
  "pyyaml>=6.0,<7.0",
  "rapidfuzz>=3.11,<4.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
