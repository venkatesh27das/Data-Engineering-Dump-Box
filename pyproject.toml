[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "source-readiness-agent"
version = "0.1.0"
description = "Governed source-readiness and ingestion-configuration agent for Azure Databricks"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic>=2.8,<3", "pydantic-settings>=2.4,<3", "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1", "httpx>=0.27,<1", "tenacity>=8.5,<10",
  "PyYAML>=6,<7", "mlflow>=2.17,<4", "databricks-sdk>=0.38,<1",
  "azure-identity>=1.19,<2", "azure-storage-file-datalake>=12.18,<13",
  "azure-mgmt-datafactory>=9,<10", "python-magic>=0.4.27,<1"
]

[project.optional-dependencies]
databricks-agent = ["databricks-agents>=0.16,<1"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "pytest-cov>=5,<8", "ruff>=0.8,<1", "mypy>=1.13,<2", "types-PyYAML>=6,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/source_readiness_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --cov=source_readiness_agent --cov-report=term-missing"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["notebooks/"]
ignore_missing_imports = true
