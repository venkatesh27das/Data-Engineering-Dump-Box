[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "excel-intelligence"
version = "0.1.0"
description = "Local deterministic workbook intelligence"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "python-multipart>=0.0.18",
    "openpyxl>=3.1.5,<4",
    "lxml>=5,<7",
    "polars>=1.0,<2",
    "duckdb>=1.1,<2",
    "networkx>=3.3,<4",
    "pillow>=10",
    "streamlit>=1.40,<2",
    "httpx>=0.27,<1",
    "langgraph>=1,<2",
    "lancedb>=0.20,<1",
    "pymupdf>=1.24,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 110
