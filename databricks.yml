bundle:
  name: source-readiness-agent

include: []

variables:
  catalog:
    description: Governed Unity Catalog catalog
  configuration_schema:
    default: source_configuration
  bronze_schema:
    default: bronze
  operations_schema:
    default: source_operations
  model_endpoint:
    default: configured-model-endpoint
  mlflow_experiment:
    default: /Shared/source-readiness-agent
  workflow_job_id:
    default: "0"

resources:
  apps:
    source_readiness:
      name: source-readiness-agent-${bundle.target}
      description: Source Readiness and Pipeline Configuration Agent
      source_code_path: .
      resources:
        - name: source-readiness-catalog
          description: Catalog binding
          uc_securable:
            securable_type: CATALOG
            securable_full_name: ${var.catalog}
            permission: USE_CATALOG
        - name: source-readiness-workflow
          description: Controlled sample workflow
          job:
            id: ${var.workflow_job_id}
            permission: CAN_MANAGE_RUN

targets:
  dev:
    default: true
    mode: development
    workspace:
      host: ${env.DATABRICKS_HOST}
  test:
    mode: development
    workspace:
      host: ${env.DATABRICKS_HOST}
  prod:
    mode: production
    workspace:
      host: ${env.DATABRICKS_HOST}
    permissions:
      - level: CAN_VIEW
        group_name: users
