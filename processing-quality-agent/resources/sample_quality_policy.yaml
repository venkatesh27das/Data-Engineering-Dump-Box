default:
  weights:
    schema_validity: 0.15
    page_coverage: 0.15
    text_quality: 0.15
    layout_quality: 0.10
    table_quality: 0.10
    metadata_completeness: 0.10
    source_reference_completeness: 0.10
    normalized_parser_confidence: 0.10
    ai_judge_score: 0.05
  publish_threshold: 0.85
  warning_threshold: 0.75
  human_review_threshold: 0.60
  blocking_failures: [CORRUPT_FILE, UNSUPPORTED_FORMAT, SCHEMA_VALIDATION_FAILURE]
document_classes:
  scanned_policy_pdf:
    high_risk: true
    blocking_failures: [PAGE_COVERAGE_FAILURE, TABLE_EXTRACTION_FAILURE]
